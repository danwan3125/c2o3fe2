[package]
name = "c2o3fe2_teamserver"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version="0.8", features=["ws","macros"]}
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = "0.4"
serde = { workspace = true }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
futures-util="0.3"
dotenvy="0.15.7"
